name: Refresh workshop cards
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'vendor/**', 'package.json', '.github/workflows/cards.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: workshop-cards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save refreshed cards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo 'Cards are current'
          else
            git commit -m 'Refresh public workshop cards'
            git push
          fi
