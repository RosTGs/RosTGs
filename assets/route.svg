<svg xmlns="http://www.w3.org/2000/svg" width="900" height="148" viewBox="0 0 900 148" role="img" aria-labelledby="title"><title id="title">Маршрут по мастерской: идея, прототип, проверка, проект</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#bbc7c7" stroke-opacity=".34" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" fill="#f5efe3"/><rect width="100%" height="100%" fill="url(#grid)"/><rect x="10" y="10" width="880" height="128" fill="none" stroke="#8f9188" stroke-width=".8"/><path d="M4 20H26M20 4V26M874 128h22M880 122v22" stroke="#8f9188" fill="none"/><g fill="#38342f" font-family="Segoe UI,Arial,sans-serif"><text x="34" y="35" font-size="12" fill="#a74336">ЗАМЕТКА ЛИЛИТ / ОТ ЗАМЫСЛА К РЕЗУЛЬТАТУ</text><path d="M92 80H810" stroke="#999d95" stroke-dasharray="4 5"/><circle cx="92" cy="80" r="6" fill="#f5efe3" stroke="#a74336"/><text x="52" y="115" font-size="14" fill="#38342f">ИДЕЯ</text><circle cx="327" cy="80" r="6" fill="#f5efe3" stroke="#a74336"/><text x="287" y="115" font-size="14" fill="#38342f">ПРОТОТИП</text><circle cx="562" cy="80" r="6" fill="#f5efe3" stroke="#a74336"/><text x="522" y="115" font-size="14" fill="#38342f">ПРОВЕРКА</text><circle cx="797" cy="80" r="6" fill="#f5efe3" stroke="#a74336"/><text x="757" y="115" font-size="14" fill="#38342f">ПРОЕКТ</text><style>@keyframes travel{0%,12%{transform:translateX(0)}30%,42%{transform:translateX(235px)}60%,72%{transform:translateX(470px)}90%,100%{transform:translateX(705px)}}.guide{animation:travel 12s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.guide{animation:none}}</style><circle class="guide" cx="92" cy="80" r="4" fill="#a74336"/></g></svg>